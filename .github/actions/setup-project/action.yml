name: Preparar payment-api
description: Configura o Python, o cache do pip e as dependencias do projeto.

inputs:
  python-version:
    description: Versao do python usada no job.
    required: true

runs:
  using: composite
  steps:
    - name: Configurar python e cache
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Instalar e conferir dependencias
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip check
