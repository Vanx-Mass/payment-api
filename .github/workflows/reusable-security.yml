name: Seguranca reutilizavel

on:
  workflow_call:

permissions:
  contents: read

jobs:
  sast:
    name: SAST Bandit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-security.txt
      - name: Procurar problemas no codigo
        run: |
          mkdir -p reports
          python -m bandit -r app -x app/tests -ll -ii -f json -o reports/bandit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: sast-bandit
          path: reports/
          retention-days: 7

  dependencies:
    name: Dependencias (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            requirements: requirements.txt
          - name: gateway
            requirements: app/gateway/requirements.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements-security.txt
      - name: Auditar dependencias e gerar SBOM
        env:
          REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          mkdir -p reports
          set +e
          python -m pip_audit -r "$REQUIREMENTS" -f json -o reports/pip-audit.json
          audit_status=$?
          python -m pip_audit -r "$REQUIREMENTS" -f cyclonedx-json -o reports/sbom.cdx.json
          sbom_status=$?
          set -e
          if [[ "$audit_status" -ne 0 || "$sbom_status" -ne 0 ]]; then exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: dependencias-${{ matrix.name }}
          path: reports/
          retention-days: 7

  secrets:
    name: Secrets Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Examinar historico Git
        run: |
          mkdir -p reports
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo:ro" -v "$PWD/reports:/reports" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo \
            --gitleaks-ignore-path /repo/.gitleaksignore --redact=100 --report-format json --report-path /reports/gitleaks.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: secrets-gitleaks
          path: reports/
          retention-days: 7

  dast:
    name: DAST ZAP autenticado
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-project
        with:
          python-version: "3.12"
      - name: Examinar stack descartavel
        run: python scripts/dast.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: dast-zap
          path: reports/dast/
          retention-days: 7
