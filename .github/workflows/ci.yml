name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 9 * * 1-5"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Seguranca
    uses: ./.github/workflows/reusable-security.yml

  tests:
    name: Testes
    uses: ./.github/workflows/reusable-tests.yml
    with:
      minimum-coverage: 80

  build:
    name: Docker (${{ matrix.image }})
    needs: [tests, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: payment-api
            context: .
            dockerfile: Dockerfile
          - image: payment-gateway
            context: .
            dockerfile: ./app/gateway/Dockerfile

    steps:
      - name: Baixar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Construir imagem
        env:
          IMAGE: ${{ matrix.image }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag "$IMAGE:ci" "$BUILD_CONTEXT"

  lab:
    name: Laboratorio de observabilidade e Airflow
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Iniciar laboratorio isolado
        run: |
          python -m pip install httpx
          docker compose -p payment-lab -f docker-compose.yml -f deploy/compose.lab.yml \
            -f deploy/compose.observability.yml up -d --build --wait --wait-timeout 180
      - name: Validar alerta, trace, logs e recuperacao
        run: python scripts/lab_incident.py
      - name: Validar DAG e reexecucao da janela
        run: python scripts/lab_reconciliation.py
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: evidencias-laboratorio
          path: reports/
          if-no-files-found: ignore
      - name: Logs do laboratorio em caso de falha
        if: failure()
        run: |
          docker compose -p payment-lab -f docker-compose.yml -f deploy/compose.lab.yml \
            -f deploy/compose.observability.yml logs --tail 100
      - name: Encerrar laboratorio
        if: always()
        run: |
          docker compose -p payment-lab -f docker-compose.yml -f deploy/compose.lab.yml \
            -f deploy/compose.observability.yml -f deploy/compose.airflow.yml down -v --remove-orphans

  ci-required:
    name: CI obrigatorio
    if: ${{ always() }}
    needs: [tests, security, build, lab]
    runs-on: ubuntu-24.04
    timeout-minutes: 2

    steps:
      - name: Exigir sucesso de testes e builds
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          LAB_RESULT: ${{ needs.lab.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          echo "Testes: $TESTS_RESULT"
          echo "Seguranca: $SECURITY_RESULT"
          echo "Laboratorio: $LAB_RESULT"
          echo "Docker: $BUILD_RESULT"
          if [[ "$TESTS_RESULT" != "success" || "$SECURITY_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$LAB_RESULT" != "success" ]]; then
            exit 1
          fi
          echo "CI aprovado."
