services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: payment_api
    volumes:
      - dados_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payment_api"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  gateway:
    image: ${GATEWAY_IMAGE:?}
    environment:
      GATEWAY_MODE: success
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    image: ${API_IMAGE:?}
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/payment_api
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?}
      PROCESSOR_BASE_URL: http://gateway:8080
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json')"]
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dados_staging:
